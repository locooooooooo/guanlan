# 观澜 Rust workspace —— 代码组织依据 docs/guanlan/观澜-Rust服务拆分方案-v0.1.md §2（41-81 行）
# - crates/guanlan-core：领域规则、只读存储、查询契约（不依赖 HTTP 框架，方案 :73）
# - crates/guanlan-service：runtime/http/mcp 接入层与 `guanlan serve` / `guanlan mcp` 入口
# - crates/guanlan-desktop：Tauri v2 桌面壳，进程内嵌 guanlan-service（方案 §7 桌面包装阶段）
# 契约依据：native/docs/contract-storage.md、native/docs/contract-query-api.md
[workspace]
resolver = "2"
members = ["crates/guanlan-core", "crates/guanlan-service", "crates/guanlan-desktop"]

[workspace.package]
version = "1.2.0"
edition = "2021"

[workspace.dependencies]
# 依赖集合在实施时选定兼容版本并锁入 Cargo.lock（方案 §7，:155）
# 本批骨架锁定的最小集合：tokio / axum / rusqlite(bundled) / serde / serde_json / sha2 / hex / thiserror
# issue #4：+sync（Semaphore 排队许可）与 +time（排队/执行 deadline）供有界查询通道
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# issue #32：响应体预算守护需实现 http_body::Body（axum 已传递依赖同版本）
http-body = "1"
axum = "0.8"
# issue #4：+hooks（progress handler）供有界查询通道的取消/超时打断；
# F03：+backup（SQLite Online Backup API，schema 升级前自动一致性备份）
rusqlite = { version = "0.42", features = ["bundled", "hooks", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
thiserror = "2.0"
# guanlan-service 批次一（runtime/http）新增：
# - fs2：同工作区 OS 级排他锁（try_lock_exclusive，方案 §7，:151），
#   Windows 走 LockFileEx、Unix 走 flock，进程退出/崩溃由操作系统自动释放
# - tokio-util：PDF 快照流式响应（ReaderStream，不整读大文件，契约 §1.8）
# - tower-http：dist 静态资源（ServeDir，dist 目录存在才挂载，方案 §7）
#   + cors：桌面壳跨源放行（WebView 源 tauri.localhost → 127.0.0.1 环回端口）
fs2 = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# 发布产物：opt-level 3 + 剥离符号。不加 lto/codegen-units=1——本机 rustc 1.99.1
# 在 tauri 依赖集的 thin-LTO 终码生成阶段确定性崩溃（STATUS_ACCESS_VIOLATION，
# 两次复现）；opt-level 3 承担主要优化，LTO 仅省少量体积/几个百分点性能。
[profile.release]
opt-level = 3
strip = true
