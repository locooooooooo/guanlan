[package]
name = "guanlan-core"
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 身份规则哈希（rootKey / file_id / event_id，契约 contract-storage.md §2）
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
# 索引器正则：陈述/引用抽取与文档自述日期识别（与 TS 基线语义一致）
regex = "1"
# Office (.docx / .xlsx) 派生解析：ZIP 解压与 XML 解析
flate2 = "1"
quick-xml = "0.42"
